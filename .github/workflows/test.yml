name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 2.11.0 起插件带运行时依赖（js-yaml 为静态导入）：干净 runner 不装依赖会在规则加载期
      #   直接 ERR_MODULE_NOT_FOUND（CI #20–#28 连续失败的根因，106 个测试文件全红）。
      #   npm ci 严格按 package-lock.json 安装、锁文件漂移在此报错；--legacy-peer-deps 与
      #   锁文件生成口径一致（web-tree-sitter 的 peer @types/emscripten 未锁入，TS 类型运行时不需要）。
      - name: 安装依赖（按 lockfile）
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      # 部分测试需要 git 提交身份（临时仓库 init/commit）
      - name: 配置 git 身份
        run: |
          git config --global user.name "dsh-git-push CI"
          git config --global user.email "ci@example.invalid"
      # lib/client.js 是构建产物（.gitignore 忽略、不入库）：doc-func/构建一致性测试需要它
      - name: 构建 client 产物
        run: node scripts/build-client.mjs
      # DSH_HOME 用 runner 临时目录：测试不依赖宿主真实配置；
      # 凭据/在线类测试在缺环境时自行条件跳过（见各测试文件）。
      # 串行跑：多个测试会写同一仓库的 index/工作区，并发时偶发互相干扰
      - name: 回归测试（--all 忽略缓存）
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        # 失败时把 not ok 列表写进 job summary —— 否则远程无法定位（日志下载需 token，
        #   API 的 check-runs 不带日志；摘要能随 check-run 一起被读到）。
        run: |
          set -o pipefail
          if node test/run-tests.mjs --all --concurrency=1 2>&1 | tee /tmp/test-run.log; then
            echo "✅ 全量测试通过" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ❌ 失败项（not ok）"
              echo '```'
              grep -E "^not ok" /tmp/test-run.log | head -40 || echo "(未捕获到 not ok，见日志尾部)"
              echo '```'
              echo "## 日志尾部"
              echo '```'
              tail -60 /tmp/test-run.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 失败项同时发成 annotation（::error::）—— job summary 只能人在 UI 看，
            #   annotation 可通过 check-runs/{id}/annotations API 读到，远程排障才拿得到具体测试名。
            grep -E "^not ok" /tmp/test-run.log | head -20 | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

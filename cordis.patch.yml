# 【改为】顶层 insert 新建行（第三方 bundle patch 标准写法）
# 【用户原话】「直接改工作区」；市场报「目标不存在 / patch target not found」
# 【思路】无 insert 的 - id 是覆盖已有 loader 行；基座没有 git-push，bundle 层打空。与 dsh-cloud-workspaces / dshmarket 同款。
- insert:
    - id: git-push
      name: dsh-git-push
      config:
        enabled: true

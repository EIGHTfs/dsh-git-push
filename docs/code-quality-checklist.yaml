# ============================================================
# 优秀代码通用评估标准（AI 可解析版）
# 适用语言：Node.js / 通用后端
# 版本：1.0
# ============================================================

criteria:
  - id: readability
    name: 可读性
    standard: "新人 15 分钟内看懂一个文件"
    good:
      - "函数名用动词短语：getUserById()"
      - "变量名带业务含义：retryCount"
      - "每个文件顶部有 // 职责：xxx"
      - "单函数 ≤ 50 行（硬上限）"
    bad:
      - "函数名缩写：gU() / proc()"
      - "变量名通用：data / obj / arr / flag"
      - "零注释，全靠猜"
      - "单函数 > 300 行"

  - id: maintainability
    name: 可维护性
    standard: "改一个功能只需改 1 个文件，不波及 3 个"
    good:
      - "单一职责：每个模块只做一件事"
      - "路由/中间件/工具按目录分离"
      - "公共逻辑抽离到 lib/，多模块 require"
      - "改动影响范围清晰可控"
    bad:
      - "一个文件管路由+鉴权+静态服务"
      - "所有代码平铺在 if-else 链里"
      - "同一段逻辑在多个文件里各复制一份"

  - id: robustness
    name: 健壮性
    standard: "面对异常输入/超时/磁盘满/恶意请求，不崩溃，优雅降级"
    good:
      - "所有 try-catch 都有 console.error 记录"
      - "输入校验：路径穿越用 resolve + startsWith 白名单"
      - "密码 ≥8 位+复杂度，scrypt 哈希"
      - "外部 API 有超时+重试+熔断"
      - "磁盘操作用 fs.promises 异步"
    bad:
      - "catch (_) {} 静默吞错"
      - "直接 fs.readdirSync(req.query.path) 无白名单"
      - "密码仅 4 位，明文存储"
      - "无超时，请求卡死事件循环"
      - "在异步路径中用 fs.existsSync 阻塞主线程"

  - id: performance
    name: 性能
    standard: "95% 请求 <200ms（API层）；批量任务不堵死单进程"
    good:
      - "频繁读取配置有内存缓存（TTL 5s）"
      - "进度存储用位图或 SQLite，增量写入"
      - "批量去重用 Set/Map，O(1)"
      - "后台任务用 setImmediate/Worker Thread 异步"
    bad:
      - "每次请求都 fs.readFileSync 读配置"
      - "每下载一个文件就 JSON.stringify(整个数组) 写盘"
      - "全量遍历数组 O(n²) 去重"
      - "后台任务在主线程同步跑，阻塞所有 API"

  - id: security
    name: 安全性
    standard: "代码公开时，攻击者无法获取凭据或绕过权限"
    good:
      - "凭据用环境变量注入，不入代码"
      - "敏感接口即使无密码也拒绝"
      - "Cookie 带 HttpOnly; Secure; SameSite=Strict"
      - "用户输入的 HTML 内容经过消毒（DOMPurify）"
    bad:
      - "配置文件中硬编码活跃 cookie"
      - "未设密码时所有 API 全开放"
      - "Cookie 无 Secure 标志，HTTP 明文传输"
      - "直接把外部描述 innerHTML 插入页面"

  - id: testing
    name: 测试覆盖
    standard: "核心逻辑有自动化测试，改动后跑一次即知是否炸"
    good:
      - "关键函数有单元测试（Jest/Vitest）"
      - "关键 API 有集成测试（真实调用）"
      - "测试在 CI 里自动跑，失败不能合并"
    bad:
      - "零测试文件"
      - "所有功能依赖手工点击验证"
      - "无 CI，全靠人肉回归"

# ============================================================
# 附加维度：工程化与可运维性
# ============================================================
additional:
  - id: observability
    name: 可观测性
    standard: "生产环境出问题时，能在 5 分钟内定位到根因"
    good:
      - "有结构化日志（含 requestId 追踪链路）"
      - "关键路径有性能埋点（响应时间、DB 查询时间）"
      - "有 /health 和 /metrics 端点供监控采集"
      - "异常时有告警（如 Slack/钉钉推送）"
    bad:
      - "只有 console.log 散落各处"
      - "没有 requestId，一个用户请求的日志被多人打散"
      - "没有健康检查，服务挂了只能靠用户反馈"
      - "错误只写文件，没人看"

  - id: deployability
    name: 可部署性
    standard: "一键部署，一键回滚，灰度发布"
    good:
      - "所有环境配置通过环境变量注入，不依赖磁盘文件路径"
      - "构建产物与源码分离，镜像体积小"
      - "支持滚动更新或蓝绿部署"
      - "回滚只需切换镜像 tag，无需改代码"
    bad:
      - "配置文件路径写死为本机绝对路径（如家目录下的 config.json）"
      - "每次部署需要手动修改多处配置"
      - "回滚需要重新打包、重新上传、重新启动"
      - "不同环境（dev/test/prod）用同一份配置硬切换"

  - id: documentation
    name: 文档与注释
    standard: "README 包含：启动命令、环境变量清单、API 示例、常见问题"
    good:
      - "README 有一键启动命令（复制即用）"
      - "环境变量有清单，标注必填/可选/默认值"
      - "关键 API 有 curl 示例"
      - "常见问题（FAQ）覆盖 80% 新手踩坑点"
    bad:
      - "README 只有项目名和作者"
      - "环境变量全靠猜"
      - "API 接口无文档，只能翻代码"
      - "FAQ 为空或过时"

# ============================================================
# 快速自查清单（完整版 10 问）
# ============================================================
checklist:
  - question: "最大函数超过 50 行了吗？"
    dimension: 可读性
  - question: "有重复代码块超过 3 处吗？"
    dimension: 可维护性
  - question: "catch(_){} 超过 10 处了吗？"
    dimension: 健壮性
  - question: "有 O(n²) 或更差的操作吗？"
    dimension: 性能
  - question: "有硬编码凭据（密码/token/密钥）吗？"
    dimension: 安全性
  - question: "有测试文件吗？"
    dimension: 测试覆盖
  - question: "有 requestId 贯穿整个请求链路吗？"
    dimension: 可观测性
  - question: "所有环境配置能通过环境变量覆盖吗？"
    dimension: 可部署性
  - question: "README 有一键启动命令和环境变量清单吗？"
    dimension: 文档
  - question: "能在一分钟内启动本地开发环境吗？"
    dimension: 开发者体验

# ============================================================
# 评分建议
# ============================================================
scoring:
  method: "逐项打分，每项 0-10 分，满分 100"
  passing: "≥70 分算合格，≥85 分算优秀"
  interpretation:
    "80-100": "工程扎实，可放心交付"
    "60-79": "可用但有技术债，建议逐步还债"
    "40-59": "风险较高，不宜直接上生产"
    "0-39": "建议重构后再上线"
  dimensions_weight:
    # v1.40.0（A6）：权重补齐（原全空，运行时一直走 quality.js DEFAULT_WEIGHTS 兜底）。
    # 与 DEFAULT_WEIGHTS 一致，总和 100：安全20 可维护15 健壮15 可读15 性能10 测试10 可观测5 可部署5 文档3 DX2
    可读性: 15
    可维护性: 15
    健壮性: 15
    性能: 10
    安全性: 20
    测试覆盖: 10
    可观测性: 5
    可部署性: 5
    文档: 3
    开发者体验: 2

# ============================================================
# 核心结论
# ============================================================
summary:
  level_definition:
    A: "功能完整，逻辑正确，用户体验良好"
    B: "代码可读，有基本模块划分，少量技术债"
    C: "可读性差，重复代码多，安全/性能隐患，零测试"
    D: "无法启动或核心功能不可用"
  rule_of_thumb: "优秀代码 = 扔给一个水平一般的新人，他看完代码、跑了测试、改完功能，没引入新 Bug，还能直接上线。"
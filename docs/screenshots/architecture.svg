<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b8c4a"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGrad)" rx="8"/>
  
  <text x="400" y="30" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="bold" font-family="system-ui,sans-serif">dsh-git-push 架构</text>
  <text x="400" y="50" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif">git 自动提交推送 · L0/L1 审计门禁 · dsh-repo-index 自动维护</text>
  
  <!-- Agent Tools -->
  <rect x="20" y="75" width="200" height="70" fill="#1e293b" stroke="#4ade80" stroke-width="2" rx="8"/>
  <text x="120" y="98" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="bold" font-family="system-ui,sans-serif">Agent 工具</text>
  <text x="120" y="115" text-anchor="middle" fill="#f8fafc" font-size="10" font-family="system-ui,sans-serif">git_scan</text>
  <text x="120" y="128" text-anchor="middle" fill="#f8fafc" font-size="10" font-family="system-ui,sans-serif">git_commit_push</text>
  <text x="120" y="141" text-anchor="middle" fill="#f8fafc" font-size="10" font-family="system-ui,sans-serif">code_audit</text>
  
  <!-- Plugin Core -->
  <rect x="260" y="75" width="280" height="70" fill="#1e293b" stroke="#60a5fa" stroke-width="2" rx="8"/>
  <text x="400" y="98" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="bold" font-family="system-ui,sans-serif">插件核心 (lib/index.js)</text>
  <text x="400" y="115" text-anchor="middle" fill="#f8fafc" font-size="10" font-family="system-ui,sans-serif">apply() 入口 + HTTP API + Tool 注册</text>
  <text x="400" y="128" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui,sans-serif">审计门禁 → commit → push → repo-index</text>
  <text x="400" y="141" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui,sans-serif">blockOn='blocker' | llmAudit 可选</text>
  
  <!-- Audit Layer -->
  <rect x="560" y="75" width="220" height="70" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="670" y="98" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="bold" font-family="system-ui,sans-serif">审计层</text>
  <text x="670" y="115" text-anchor="middle" fill="#f8fafc" font-size="10" font-family="system-ui,sans-serif">L0 静态 (零 token)</text>
  <text x="670" y="128" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui,sans-serif">语法/敏感信息/大文件</text>
  <text x="670" y="141" text-anchor="middle" fill="#f8fafc" font-size="10" font-family="system-ui,sans-serif">L1 LLM (可选，省 token)</text>
  
  <!-- Git Operations -->
  <rect x="100" y="180" width="200" height="50" fill="#0f172a" stroke="#6b7280" stroke-width="1" rx="6"/>
  <text x="200" y="200" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui,sans-serif">git 操作</text>
  <text x="200" y="216" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui,sans-serif">scanRepos / commitAndPush</text>
  <text x="200" y="228" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui,sans-serif">lib/core.js (Node child_process)</text>
  
  <!-- Repo Index -->
  <rect x="350" y="180" width="220" height="50" fill="#0f172a" stroke="#a78bfa" stroke-width="1" rx="6"/>
  <text x="460" y="200" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold" font-family="system-ui,sans-serif">repo-index 维护</text>
  <text x="460" y="216" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui,sans-serif">buildRepoIndex + sync</text>
  <text x="460" y="228" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui,sans-serif">lib/repo-index.js (推送后自动)</text>
  
  <!-- GitHub API -->
  <rect x="600" y="180" width="180" height="50" fill="#0f172a" stroke="#6b7280" stroke-width="1" rx="6"/>
  <text x="690" y="200" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui,sans-serif">GitHub API</text>
  <text x="690" y="216" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui,sans-serif">可见性查询 (token)</text>
  <text x="690" y="228" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui,sans-serif">api.github.com</text>
  
  <!-- Push Target -->
  <rect x="250" y="280" width="300" height="50" fill="#1e293b" stroke="#ef4444" stroke-width="2" rx="8"/>
  <text x="400" y="300" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="bold" font-family="system-ui,sans-serif">api.github.com Git Data API</text>
  <text x="400" y="316" text-anchor="middle" fill="#f8fafc" font-size="10" font-family="system-ui,sans-serif">blob → tree → commit → ref（不直连 github.com）</text>
  <text x="400" y="328" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui,sans-serif">clone / push / create / tag 同一通道</text>
  
  <!-- Arrows -->
  <line x1="220" y1="110" x2="260" y2="110" stroke="#6b8c4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="110" x2="560" y2="110" stroke="#6b8c4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="145" x2="400" y2="180" stroke="#6b8c4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="230" x2="200" y2="280" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="230" x2="460" y2="280" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="230" x2="690" y2="280" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
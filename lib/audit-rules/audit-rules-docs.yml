# dsh-skip-doc: 链接规则定义文件含 URL 模式示范（非真实待检链接）
# dsh-git-push 审计规则（docs 槽位）：链接判断（link-check）
# link-check kind 由 lib/link-check/index.js 实现；本槽位只声明开关、分级与 flaky 清单。
metadata:
  name: "docs 审计规则（链接判断槽位）"
  version: "1.0.0"

rules:
  - id: link-check
    kind: link-check
    name: "链接有效性"
    category: "documentation"
    severity: "warning"        # 只 warning 永不 blocker：网络不可靠不应拦提交
    description: "检查 md 文档中的 http(s) 链接：404/403 大扣分、DNS 中扣分、超时/5xx 小扣分；flaky 域名网络错误 ×0.2"
    status_dead: [404, 403, 410, 451]
    status_transient: [408, 425, 429, 500, 502, 503, 504]
    flaky_hosts:
      - github.com
      - api.github.com
      - raw.githubusercontent.com
      - registry.npmjs.org
    flaky_factor: 0.2
    score_dead: -3
    score_dns: -2
    score_transient: -1
    timeouts_ms: 5000
    concurrency: 10
    max_links: 200

# dsh-skip-doc: 链接规则定义文件含 URL 模式示范（非真实待检链接）
# dsh-git-push 审计规则（docs 槽位）：链接判断（link-check）+ 文档加分制（docs-score）
# link-check kind 由 lib/link-check/index.js 实现。
# 文档加分制（docs-score）**不是规则**：由 lib/score/docs-score.js 实现（结构信号 + 版本交叉验证，
#   0 分起上限 10，不进 findings/扣分维度/门禁，scoreQuality context.docsScore 单独加分）——
#   故不在本 yml 声明（声明会被当规则 kind 编译报错）。
metadata:
  name: "docs 审计规则（链接判断槽位）"
  version: "1.1.0"

rules:
  - id: link-check
    kind: link-check
    name: "链接有效性"
    category: "documentation"
    severity: "warning"        # 只 warning 永不 blocker：网络不可靠不应拦提交
    description: "检查 md 文档中的 http(s) 链接：404/403 大扣分、DNS 中扣分、超时/5xx 小扣分；flaky 域名网络错误 ×0.2"
    status_dead: [404, 403, 410, 451]
    status_transient: [408, 425, 429, 500, 502, 503, 504]
    flaky_hosts:
      - github.com
      - api.github.com
      - raw.githubusercontent.com
      - registry.npmjs.org
    flaky_factor: 0.2
    score_dead: -3
    score_dns: -2
    score_transient: -1
    timeouts_ms: 5000
    concurrency: 10
    max_links: 200


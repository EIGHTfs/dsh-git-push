# ============================================================
# Rust 代码审计规则集（首版 · 语言专项）
# 版本：0.2.0
# 适用：Rust 项目
# 描述：本槽位首版语言专项规则（**纯 pattern 层**，不依赖 AST 函数范围）。
#       规则依据：对真实 Rust 仓（dtolnay/anyhow 等样本仓）实测各候选模式的出现次数后选型。
#       （AST 层的 min_length/max_lines/max_complexity/magic-number 仍待补 LANG_FUNC_RANGES.rust）
# 口径：exts 只认 .rs；测试目录排除（测试里 unwrap/println 是惯用写法）。
# ============================================================

metadata:
  name: "Rust 审计规则集（首版 · 语言专项）"
  version: "0.2.0"
  language: "rust"
  author: "DeepSeek"
  description: "Rust 项目语言专用规则（pattern 层首版：unwrap/unimplemented!/panic!/println!/unsafe）"
  last_updated: "2026-10-16"

rules:
  # ----- 1. 健壮性 -----

  - id: rust/unwrap-in-production
    name: "Rust 生产代码避免裸 unwrap()"
    category: "robustness"
    severity: "warning"
    description: "裸 unwrap() 在 None/Err 时直接 panic（等于崩溃）；生产路径应用 ? / unwrap_or / match 显式处置"
    # 只匹配无参 unwrap()（unwrap_or/unwrap_or_else 等带参形态不在此列 ✓）
    patterns:
      - "\\.unwrap\\s*\\(\\s*\\)"
    exts: ["rs"]
    exclude_paths:
      - "tests/"
      - "test/"
      - "benches/"
      - "benchmarks/"
      - "examples/"
      - "example/"
    fixable: false

  - id: rust/unimplemented-macro
    name: "Rust 禁止遗留 unimplemented!/todo!"
    category: "robustness"
    severity: "error"
    description: "unimplemented!/todo! 是明确的「未实现」占位，运行到即 panic；合入主干前必须补齐实现"
    # astConfirm：行级「是否代码行」判定——实测 anyhow 的 16 条命中里 **14 条落在文档注释**
    #   （`///     # unimplemented!()` 这类用法示例 ✗）⇒ 不加这层会把文档当违规
    astConfirm: true
    patterns:
      - "(?<![\\w!])(?:unimplemented|todo)\\s*!"
    exts: ["rs"]
    exclude_paths:
      - "tests/"
      - "test/"
      - "examples/"
      - "example/"
    fixable: false

  - id: rust/panic-macro
    name: "Rust 慎用 panic!"
    category: "robustness"
    severity: "warning"
    description: "panic! 用于不可恢复错误；库代码应返回 Result，把处置权交给调用方"
    # 同 unimplemented-macro：文档注释里常出现 panic! 示例 ⇒ 行级代码判定
    astConfirm: true
    patterns:
      - "(?<![\\w!])panic\\s*!"
    exts: ["rs"]
    exclude_paths:
      - "tests/"
      - "test/"
      - "examples/"
      - "example/"
    fixable: false

  # ----- 2. 可维护性 -----

  - id: rust/println-debug
    name: "Rust 避免用 println! 输出运行期信息"
    category: "maintainability"
    severity: "notice"
    description: "println! 直写 stdout 且无级别/目标控制；库与服务代码应走 log/tracing"
    astConfirm: true
    patterns:
      - "(?<![\\w!])println\\s*!"
      - "(?<![\\w!])print\\s*!"
    exts: ["rs"]
    exclude_paths:
      - "tests/"
      - "test/"
      - "benches/"
      - "examples/"
      - "example/"
      # build.rs 是构建脚本：编译期进度/诊断打印是常态（实测 anyhow 的 13 条里有 8 条在 build.rs）
      - "build.rs"
    fixable: false

  # ----- 3. 安全 -----

  - id: rust/unsafe-block
    name: "Rust unsafe 块需显式评审"
    category: "security"
    severity: "error"
    description: "unsafe 关闭借用检查等保证，内存安全需自行论证；每处 unsafe 都应附安全前提注释，且尽量收敛到最小块"
    astConfirm: true
    patterns:
      - "(?<![\\w:.])unsafe\\s*\\{"
      - "(?<![\\w:.])unsafe\\s+fn\\b"
    exts: ["rs"]
    fixable: false

# 版本控制审计规则（默认加载槽位）
# 权威源：skills/git-workflow-gitpush/versioning-rule.md（EIGHTfs 自研插件版本号规则，
#   2026-08-20/21 确立，2026-10-02 修订「0.x 合法开发期」——对齐 SemVer 2.0.0 第 4 条
#   与 Go/Cargo 官方实践，适用本机所有 dsh-* 自研插件 + gbmd 三组件）。
# 落地为 yml 审计：versioning-rule 的「语义规则」（版本只在提交时变化 / 大版本换代判定）
#   需 git log 对比，引擎静态正则无法表达（走人工/code_audit LLM）；正则可执行规则全部转这里：
#   ①X.Y.Z 三段格式（0.x 合法——开发初始阶段，SemVer §4）②README 版本记录标题 ③patch 版本字段行为。
# 目标文件：package.json / *.json（manifest） / *.md / README 版本表 —— 用 exts 限定。
metadata:
  name: "版本控制审计规则集（versioning-rule 转写）"
  author: "EIGHTfs"
  version: "2.0.0"
  description: "版本号 X.Y.Z 语义 + 0.x 合法开发期（1.0 稳定线）+ 版本只在提交时变化 + README 更新日志同步（源：versioning-rule.md）"

rules:
  # ── ① 格式：X.Y.Z 三段（versioning-rule §一；0.x 合法——SemVer §4 开发初始阶段）──
  - id: version/format-not-triple
    name: "版本号非 X.Y.Z 三段格式"
    category: "version"
    severity: "error"
    description: "DSH 插件 package.json version 必须 X.Y.Z 三段（两段 1.0 / 四段 1.0.0.1 / 带前缀均不合规）；gbmd manifest MV3 同样要求三段；X 可为 0（0.x = 开发初始阶段，SemVer §4）"
    exts: ["json"]
    patterns:
      - "\"version\"\\s*:\\s*\"(?![0-9]+\\.[0-9]+\\.[0-9]+\")"
    fixable: true
    mitigation: "改为 X.Y.Z（如 1.2.0 或 0.3.0——0.x 合法开发期）"
  - id: version/tag-format
    name: "git 版本标签格式（vX.Y.Z）"
    category: "version"
    severity: "warning"
    description: "提交/打 tag 用 vX.Y.Z 规范格式；不带 v 前缀或非三段标签与发布工具约定不一致"
    exts: ["md", "sh", "mjs", "yml"]
    patterns:
      - "tag\\s+v?[0-9]+\\.[0-9]+[^\\s\"]*"
    fixable: false
    mitigation: "统一 vX.Y.Z（如 git tag v1.2.0）"

  # ── ③ 版本只在提交时变化（versioning-rule §零，检出"开发期乱升"线索）──
  - id: version/changelog-many-entries
    name: "README 单版本下多条更新记录（可能违反一次提交=一小版本）"
    category: "version"
    severity: "info"
    description: "版本号指向「提交存档」而非「功能进度」：一次提交 = 一个小版本（Y+1）；README 同一版本号下堆积大量功能条目时提示核对是否应分次提交存档。命中即提示，需 git log 人工确认"
    exts: ["md"]
    patterns:
      - "##?\\s+v?[0-9]+\\.[0-9]+\\.[0-9]+"
    fixable: false
    mitigation: "核对该版本含几次提交；按「一次提交一小版本」拆版本记录"
  - id: version/bump-mismatch
    name: "版本号与提交信息不一致（提交即存档新版本）"
    category: "version"
    severity: "info"
    description: "提交信息里的版本号应与 package.json 一致（提交时先升 Y+1 再提交，见 versioning-rule §七）；本规则命中提交信息含版本号的行，核对与存档版本一致"
    exts: ["md"]
    patterns:
      - "版本\\s*[:：]?\\s*v?[0-9]+\\.[0-9]+\\.[0-9]+"
    fixable: false
    mitigation: "提交前核对 package.json version = 提交信息版本号；开发期版本号不动"

  # ── ④ README 更新日志标题（release-docs-rule：新功能提交必须整理 README）──
  - id: version/readme-changelog
    name: "README 缺版本记录（更新日志）"
    category: "version"
    severity: "info"
    description: "新功能提交必须整理 README 版本记录（release-docs-rule）；命中 README 中版本表格行即提示核对「当前版本」与 package.json 同步"
    exts: ["md"]
    patterns:
      - "\\*\\*[0-9]+\\.[0-9]+\\.[0-9]+[^*]*\\*\\*"
    fixable: false
    mitigation: "README 版本表加当前版本行（功能/修复要点），与 package.json version 一致"
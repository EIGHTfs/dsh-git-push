# ============================================================
# 注释关键词检测规则集（AI 用户交流注释识别）
# 作者：DeepSeek
# 版本：1.0.0
# 适用：所有 JavaScript / TypeScript / HTML 文件 + 文档（md/txt）
# exts 说明（2026-09-13）：显式声明作用域——本包只查「注释/文档」载体，不查 .json。
#   不声明时插件配置文件也会被扫：里面写给 AI 的流程约定会被当「公开文档夹带
#   沟通记录」误报成 blocker，把提交门禁卡死。
# 描述：检测代码中残留的 AI 用户交流注释
# 最后更新：2026-09-08
# ============================================================

metadata:
  name: "注释质量检测规则（AI 交流注释识别）"
  version: "1.0.0"
  language: "all"
  author: "DeepSeek"
  description: "检测『用户指示 2』『用户原话』等 AI 协作残留注释"
  last_updated: "2026-09-08"

rules:
  - id: documentation/comment-suspicious-detection
    exts: ["js", "mjs", "cjs", "ts", "tsx", "jsx", "html", "htm"]
    name: "检测 AI 用户交流可疑注释"
    category: "documentation"
    severity: "blocker"
    description: "检测代码中残留的 AI 用户交流注释（用户说/用户要求/用户原话等，命中即拦截提交）"
    fixable: true
    action: "建议在 PR 前清理，或将关键信息移至 git commit message"

    # ----- 黑名单（命中即拦截提交；白名单命中整行豁免） -----
    blacklist:
      - pattern: "用户指示"
      - pattern: "用户原话"
      - pattern: "用户反馈"
      - pattern: "根据用户"
      - pattern: "客户要求"
      - pattern: "用户说"
      - pattern: "原话"
      - pattern: "指示"
      - pattern: "用户要求"
      - pattern: "User request"
      - pattern: "require user"
      - pattern: "根据要求"
      - pattern: "User feedback"
      - pattern: "AI 说"
      - pattern: "机器说"
      - pattern: "人工要求"
      - pattern: "用户约定"
      - pattern: "用户规定"
      - pattern: "用户明确"
      - pattern: "用户拍板"
      - pattern: "用户裁决"      
      - pattern: "用户："
      - pattern: "用户(同意|许可|确认|约定|指定|已定调|拍板|让我|要求我|跟我说)"
      # 2026-10-14 补：以下措辞此前漏网（注释里实际出现过「用户方案定稿」「用户定稿」「用户决定」）
      - pattern: "用户(方案|定稿|决定|认为|指出|提到|说过|告诉|希望|想要|偏好|选择|初衷|口径|诉求|指令|吩咐|口述)"
      - pattern: "方案定稿"
      - pattern: "规则定稿"
      - pattern: "定稿(了|版|说明|记录)"
      - pattern: "(本次|上次|上一轮|本轮|这一轮)[ ]*会话"
      - pattern: "会话(记录|里|中|要求|约定)"
      - pattern: "你(要求|让我|希望|提到|指出|说过)"
      - pattern: "AI[ ]*(跟进|协作|沟通|对话|分析|建议|承诺)"
      - pattern: "(沟通|对话)(记录|措辞|词)"
      - pattern: "(商量|协商)后?(结论|结果|定)"

    # ----- 白名单（业务词豁免：命中则整行不拦截） -----
    whitelist:
      - pattern: "用户ID"
      - pattern: "用户登录"
      - pattern: "用户状态"
      - pattern: "用户权限"
      - pattern: "用户角色"
      - pattern: "用户信息"
      - pattern: "用户数据"
      - pattern: "用户配置"
      - pattern: "用户设置"
      - pattern: "用户会话"
      - pattern: "用户认证"
      - pattern: "用户验证"
      - pattern: "用户注册"
      - pattern: "用户密码"
      - pattern: "用户邮箱"
      - pattern: "用户名"
      - pattern: "用户头像"
      - pattern: "用户组"
      - pattern: "用户表"
      - pattern: "用户服务"
      - pattern: "用户模块"
      - pattern: "用户旅程"

  - id: conv-session-ref
    exts: ["js", "mjs", "cjs", "ts", "tsx", "jsx", "html", "htm", "md", "markdown", "txt"]
    name: "文档引用会话"
    category: "documentation"
    severity: "blocker"
    description: "文档含会话/对话引用措辞，公开文档应只写做了什么"
    pattern: "(本会话|本次会话|本对话|开发会话|session-[0-9a-f]{8,})"
    fixable: false
  - id: conv-user-decision
    # 只查**文档**：代码文件（js/mjs/ts/jsx/html 等）的同类命中由 documentation/comment-suspicious-detection
    #   负责（它带 blacklist + AST 精筛，能区分注释与字符串字面量）。
    #   此前本规则 exts 里含代码扩展名 ⇒ 与前者报同一批位置：实测 archify 上两条各报 7 条、
    #   (file:line) 交集 5 条，同一条注释被两个 blocker 各拦一次。
    exts: ["md", "markdown", "txt"]
    name: "文档引用用户决策"
    category: "documentation"
    severity: "blocker"
    description: "文档含「用户同意/要求我」类沟通记录，公开文档应改写"
    pattern: "用户(同意|许可|确认|约定|指定|已定调|拍板|让我|要求我|跟我说)"
    fixable: false
  - id: conv-ai-permit
    exts: ["js", "mjs", "cjs", "ts", "tsx", "jsx", "html", "htm", "md", "markdown", "txt"]
    name: "文档 AI 承诺措辞"
    category: "documentation"
    severity: "blocker"
    description: "文档含 AI 承诺类沟通记录，公开文档应改写"
    pattern: "我(同意|许可|确认|答应|承诺|已按你)"
    fixable: false
  - id: conv-negotiate
    exts: ["js", "mjs", "cjs", "ts", "tsx", "jsx", "html", "htm", "md", "markdown", "txt"]
    name: "文档协商措辞"
    category: "documentation"
    severity: "blocker"
    description: "文档含协商讨论记录，公开文档应改写"
    pattern: "我们(商量|讨论|约定|沟通|说好|议定)"
    fixable: false
  - id: conv-log
    exts: ["js", "mjs", "cjs", "ts", "tsx", "jsx", "html", "htm", "md", "markdown", "txt"]
    name: "文档对话记录引用"
    category: "documentation"
    severity: "blocker"
    description: "文档引用对话/聊天记录，公开文档应改写"
    pattern: "(对话记录|聊天记录|沟通记录|对话内容|聊天内容)"
    fixable: false

  # ----- 2026-10-05：注释日期检测（评审规则——AI 注释写日期的毛病）-----
  # 日期属于 git commit（author date + diff），注释只解释「为什么」不该记录「什么时候」。
  # 只扫代码注释载体：js/ts/py 等——md/txt 文档内容日期（CHANGELOG/LICENSE/文章）是正常书写，不扫。
  # @since/@deprecated/@version 是 JSDoc 标准标签（版本语义非变更日志），整行白名单豁免。
  - id: comment/no-date-in-comment
    exts: ["js", "mjs", "cjs", "ts", "tsx", "jsx", "html", "htm", "py"]
    name: "禁止注释中写日期"
    category: "documentation"
    severity: "warning"
    description: "日期属于 git commit（author date + diff + message），不应写进代码注释；注释只解释「为什么这么做」，不记录「什么时候改的」——变更历史交给版本控制"
    # 2026-10-02 修：负向断言 `(?![\d.])`——日分量后不能是数字（防 \d{1,2} 只匹配日的一部分
    #   绕过断言）也不能是 `.`（排除文件名引用 BUGFIX-NOTES-2026-09-14.md——文件名含日期是
    #   历史命名，删了引用失真；注释里引用文件名不算「写日期」）。
    pattern: "(?://|\\*|#)\\s*[^\n]*\\d{4}[-/.]\\d{1,2}[-/.]\\d{1,2}(?![\\d.])"
    whitelist_patterns:
      - "@since"
      - "@deprecated"
      - "@version"
      - "@date"
    fixable: false

severity_map:
  info: "info"

# ----- 阈值 -----
thresholds:
  max_info: 30

# ----- 忽略规则 -----
ignore:
  - pattern: "**/*.{test,spec}.{js,ts,jsx,tsx}"
    rules: ["*"]
  - pattern: "**/vendor/**/*"
    rules: ["*"]
  - pattern: "**/dist/**/*"
    rules: ["*"]

# ----- 输出 -----
output:
  format: "json"
  include_suggestions: true
  include_fix_instructions: true
# ============================================================
# 注释关键词检测规则集（AI 用户交流注释识别）
# 作者：DeepSeek
# 版本：1.0.0
# 适用：所有 JavaScript / TypeScript / HTML 文件 + 文档（md/txt）
# exts 说明（2026-09-13）：显式声明作用域——本包只查「注释/文档」载体，不查 .json。
#   不声明时插件配置文件也会被扫：里面写给 AI 的流程约定会被当「公开文档夹带
#   沟通记录」误报成 blocker，把提交门禁卡死。
# 描述：检测代码中残留的 AI 用户交流注释
# 最后更新：2026-09-08
# ============================================================

metadata:
  name: "注释质量检测规则（AI 交流注释识别）"
  version: "1.0.0"
  language: "all"
  author: "DeepSeek"
  description: "检测『用户指示 2』『用户原话』等 AI 协作残留注释"
  last_updated: "2026-09-08"

rules:
  - id: documentation/comment-suspicious-detection
    exts: ["js", "mjs", "cjs", "ts", "tsx", "jsx", "html", "htm"]
    name: "检测 AI 用户交流可疑注释"
    category: "documentation"
    severity: "blocker"
    description: "检测代码中残留的 AI 用户交流注释（用户说/用户要求/用户原话等，命中即拦截提交）"
    fixable: true
    action: "建议在 PR 前清理，或将关键信息移至 git commit message"

    # ----- 黑名单（命中即拦截提交；白名单命中整行豁免） -----
    blacklist:
      - pattern: "用户指示"
      - pattern: "用户原话"
      - pattern: "用户反馈"
      - pattern: "根据用户"
      - pattern: "客户要求"
      - pattern: "用户说"
      - pattern: "原话"
      - pattern: "指示"
      - pattern: "用户要求"
      - pattern: "User request"
      - pattern: "require user"
      - pattern: "根据要求"
      - pattern: "User feedback"
      - pattern: "AI 说"
      - pattern: "机器说"
      - pattern: "人工要求"
      - pattern: "用户约定"
      - pattern: "用户规定"
      - pattern: "用户明确"
      - pattern: "用户拍板"
      - pattern: "用户："
      - pattern: "用户(同意|许可|确认|约定|指定|已定调|拍板|让我|要求我|跟我说)"

    # ----- 白名单（业务词豁免：命中则整行不拦截） -----
    whitelist:
      - pattern: "用户ID"
      - pattern: "用户登录"
      - pattern: "用户状态"
      - pattern: "用户权限"
      - pattern: "用户角色"
      - pattern: "用户信息"
      - pattern: "用户数据"
      - pattern: "用户配置"
      - pattern: "用户设置"
      - pattern: "用户会话"
      - pattern: "用户认证"
      - pattern: "用户验证"
      - pattern: "用户注册"
      - pattern: "用户密码"
      - pattern: "用户邮箱"
      - pattern: "用户名"
      - pattern: "用户头像"
      - pattern: "用户组"
      - pattern: "用户表"
      - pattern: "用户服务"
      - pattern: "用户模块"
      - pattern: "用户旅程"

  - id: conv-session-ref
    exts: ["js", "mjs", "cjs", "ts", "tsx", "jsx", "html", "htm", "md", "markdown", "txt"]
    name: "文档引用会话"
    category: "documentation"
    severity: "blocker"
    description: "文档含会话/对话引用措辞，公开文档应只写做了什么"
    pattern: "(本会话|本次会话|本对话|开发会话|session-[0-9a-f]{8,})"
    fixable: false
  - id: conv-user-decision
    exts: ["js", "mjs", "cjs", "ts", "tsx", "jsx", "html", "htm", "md", "markdown", "txt"]
    name: "文档引用用户决策"
    category: "documentation"
    severity: "blocker"
    description: "文档含「用户同意/要求我」类沟通记录，公开文档应改写"
    pattern: "用户(同意|许可|确认|约定|指定|已定调|拍板|让我|要求我|跟我说)"
    fixable: false
  - id: conv-ai-permit
    exts: ["js", "mjs", "cjs", "ts", "tsx", "jsx", "html", "htm", "md", "markdown", "txt"]
    name: "文档 AI 承诺措辞"
    category: "documentation"
    severity: "blocker"
    description: "文档含 AI 承诺类沟通记录，公开文档应改写"
    pattern: "我(同意|许可|确认|答应|承诺|已按你)"
    fixable: false
  - id: conv-negotiate
    exts: ["js", "mjs", "cjs", "ts", "tsx", "jsx", "html", "htm", "md", "markdown", "txt"]
    name: "文档协商措辞"
    category: "documentation"
    severity: "blocker"
    description: "文档含协商讨论记录，公开文档应改写"
    pattern: "我们(商量|讨论|约定|沟通|说好|议定)"
    fixable: false
  - id: conv-log
    exts: ["js", "mjs", "cjs", "ts", "tsx", "jsx", "html", "htm", "md", "markdown", "txt"]
    name: "文档对话记录引用"
    category: "documentation"
    severity: "blocker"
    description: "文档引用对话/聊天记录，公开文档应改写"
    pattern: "(对话记录|聊天记录|沟通记录|对话内容|聊天内容)"
    fixable: false

# ----- 清洗改写表（scrub-user-wording.mjs 读取；审计不消费）-----
# 顺序敏感：先特例后通配。match 为 JS 正则源码（脚本加 g 标志）。
# replace 为替换模板：$1/$2… 对应捕获组；空串=删除。
rewrites:
  # 1) 括注「用户原话」→ 删除括注，后续冒号保留
  - match: "（用户原话）"
    replace: ""
  - match: "\\(用户原话\\)"
    replace: ""
  # 2) 日期 + 措辞 → 只留日期
  - match: "(\\d{4}-\\d{2}-\\d{2}) 用户要求（"
    replace: "$1（"
  - match: "(\\d{4}-\\d{2}-\\d{2}) 用户要求加回"
    replace: "$1 加回"
  - match: "(\\d{4}-\\d{2}-\\d{2}) 用户要求："
    replace: "$1："
  - match: "(\\d{4}-\\d{2}-\\d{2}) 用户要求"
    replace: "$1"
  - match: "(\\d{4}-\\d{2}-\\d{2}) 用户原话："
    replace: "$1："
  - match: "(\\d{4}-\\d{2}-\\d{2}) 用户约定："
    replace: "$1："
  - match: "(\\d{4}-\\d{2}-\\d{2}) 用户确立"
    replace: "$1"
  - match: "(\\d{4}-\\d{2}-\\d{2}) 用户确认"
    replace: "$1"
  - match: "(\\d{4}-\\d{2}-\\d{2}) 用户同意"
    replace: "$1"
  # 3) 措辞 + 「内容」 → 「内容」（引号内容保留）
  - match: "用户原话[：:]?「"
    replace: "「"
  - match: "用户原话「"
    replace: "「"
  # 4) （用户要求…） → （…
  - match: "（用户要求[：:]?"
    replace: "（"
  - match: "\\(用户要求[：:]?"
    replace: "("
  # 5) 「用户要求恢复此形态」→ 删除
  - match: "用户要求恢复此形态"
    replace: ""
  # 6) 孤立措辞 → 删除
  - match: "用户要求[：:]?"
    replace: ""
  - match: "用户原话[：:]?"
    replace: ""
  - match: "用户约定[：:]?"
    replace: ""
  - match: "用户规定[：:]?"
    replace: ""
  - match: "用户明确[：:]?"
    replace: ""
  - match: "用户拍板[：:]?"
    replace: ""
  - match: "用户确立[：:]?"
    replace: ""
  - match: "用户确认[：:]?"
    replace: ""
  - match: "用户同意[：:]?"
    replace: ""
  - match: "用户许可[：:]?"
    replace: ""
  - match: "用户说[：:]?"
    replace: ""
  - match: "用户："
    replace: ""

# ----- 严重级别 -----
severity_map:
  info: "info"

# ----- 阈值 -----
thresholds:
  max_info: 30

# ----- 忽略规则 -----
ignore:
  - pattern: "**/*.{test,spec}.{js,ts,jsx,tsx}"
    rules: ["*"]
  - pattern: "**/vendor/**/*"
    rules: ["*"]
  - pattern: "**/dist/**/*"
    rules: ["*"]

# ----- 输出 -----
output:
  format: "json"
  include_suggestions: true
  include_fix_instructions: true
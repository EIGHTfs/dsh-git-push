# dsh-skip-sensitive: 规则定义文件含符号示范文本（fs.readFileSync / push / while 等）
# dsh-skip-residue: 规则定义文件含 console/while(true) 模式串示范（规则定义本身）
# dsh-git-push 审计规则（performance 槽位，1.0.4 beta）
# 性能审计：内存爆炸 / 无界增长等高成本代码模式（子模式规则示范，文档 §13）。
# 规则类型由编译函数按字段自动指派；patterns 条目支持对象子模式（id/pattern/message）。
# dimensions：10 维度绑定，支持一字段多维度。
metadata:
  name: "性能审计规则（memory-bomb 示范落地）"
  version: "1.0.4"

rules:
  # ── 内存爆炸检测（文档 §13 示例规则落地：子模式 + per-pattern message）──
  - id: performance/memory-bomb
    name: "检测可能导致内存爆炸的代码"
    category: "performance"
    severity: "warning"
    description: "短时间内占用大量内存的代码模式（受控的本地小 JSON/配置文件读取不算）"
    # 2026-09-27：仅代码文件——docs 方案文的「全量读入文件」示例是讲解文本，不是运行代码
    exts: ["js", "mjs", "cjs", "ts", "tsx", "jsx", "py"]
    # 2026-09-13：子模式精筛——full-file-read 命中后由引擎确认「读的是否受控小文件」
    astConfirmKind: "small-file-read"
    patterns:
      - id: full-file-read
        pattern: "fs\\.(readFileSync|readFile)\\s*\\("
        # 2026-09-13 误报修复（正则初筛 → AST 精筛）：本规则针对「大文件全量读入」，
        #   读**受控的本地小 JSON 数据/配置文件**（记分数据、标题缓存等，紧跟
        #   JSON.parse 或路径变量含 data/cache/config/locale）不构成内存爆炸风险——
        #   旧实现命中即报，对任何读 JSON 的项目恒定误报。精筛条件见 astConfirmKind。
        message: "全量读入文件可能占用大量内存，建议用流式处理"
      - id: unbounded-push
        pattern: "(for|while)\\s*\\([^)]*\\)\\s*\\{[^}]*\\.push\\s*\\([^)]*\\)"
        message: "循环内 push 无界累积（可能内存增长失控），检查是否有清理机制或上限"
      - id: chained-push
        pattern: "\\.push\\s*\\([^)]*\\)\\s*\\.push"
        message: "链式 push 连续追加（警惕无界累积），确认有上限控制"
      - id: array-spread
        pattern: "\\[\\s*\\.\\.\\.\\w+\\s*,\\s*\\.\\.\\.\\w+\\s*\\]"
        message: "展开多个大数组会一次性创建新数组"
      - id: infinite-loop
        pattern: "while\\s*\\(\\s*true\\s*\\)"
        message: "无限循环需确认有 break 条件和内存控制"
      - id: exec-sync
        pattern: "execSync\\s*\\("
        message: "execSync 输出全部进内存，建议用 spawn + 流"
      - id: json-stringify-large
        pattern: "JSON\\.stringify\\s*\\([^)]{50,}\\)"
        message: "大对象序列化会瞬间产生等量字符串"
    fixable: false
    mitigation: |
      - 大文件用 fs.createReadStream 流式处理
      - 数组累积加 maxLength 上限，超出时丢弃旧数据
      - 缓存加 TTL 或 LRU 淘汰机制
      - 递归加深度限制
      - 子进程用 spawn + 流式读取

  # ── 循环内全量集合物化（二次增长；真实样本见 lib/ast/perf.js 注释）──
  - id: performance/loop-full-collection
    name: "禁止在循环体内做全量集合物化"
    category: "performance"
    severity: "warning"
    description: "循环体内 Array.from(x.values()/keys()/entries()) 会把整个集合物化一遍：成本≈循环次数×集合大小，随数据量二次增长（应先建索引、循环内 O(1) 查）"
    exts: ["js", "mjs", "cjs", "ts", "tsx", "jsx"]
    # 纯正则无法表达「在不在循环体内」——由 AST 精筛（allow 语义：只报循环体内的命中）
    astConfirmKind: "loop-full-collection"
    patterns:
      - id: array-from-values
        pattern: "Array\\.from\\s*\\(\\s*[A-Za-z_$][\\w.$]*\\.(values|keys|entries)\\s*\\(\\s*\\)\\s*\\)"
        message: "循环体内全量物化集合：改为循环外建一次索引（Map/Set），循环内 O(1) 查"
    fixable: false
    mitigation: "循环外建 Map/Set 索引（如 name→nodeId），循环内用 .get()/.has() 查；确需快照时提到循环外"

  # ── 循环内重复调用同一函数（可记忆化 / 提前计算）──
  - id: performance/repeat-identical-call
    name: "同一循环体内重复调用同一函数（实参完全相同）"
    category: "performance"
    severity: "warning"
    description: "同一循环体内 ≥2 次实参完全相同的调用：若该函数为纯函数且开销不小，应记忆化或提到循环外（真实案例：路径解析函数在解析循环内被调 8762 次、占全量扫描 89%，加记忆化后 4581ms→344ms）"
    exts: ["js", "mjs", "cjs", "ts", "tsx", "jsx"]
    # 纯正则无法表达「在不在循环体内 / 实参是否相同」——由 AST 精筛（allow 语义）
    astConfirmKind: "repeat-identical-call"
    patterns:
      - id: repeated-call
        pattern: "[A-Za-z_$][\\w.$]*\\s*\\([^()]*\\)"
        message: "循环体内重复调用（实参相同）：若为纯函数可记忆化或提前计算"
    fixable: false
    mitigation: "加一层 Map 记忆化（键=入参组合）或把结果提到循环外；有副作用的调用（写文件/网络/日志）不适用"

  # ── 无界循环 / 高 CPU 轮询（性能补充）──
  - id: performance/busy-wait-loop
    name: "忙等待循环（高 CPU 空转）"
    category: "performance"
    severity: "warning"
    description: "while 空循环 / 同步轮询会占满 CPU 核心，建议用 setTimeout/async 等待"
    patterns:
      - "while\\s*\\(\\s*[^)]*true[^)]*\\s*\\)\\s*\\{\\s*\\}"
      - "for\\s*\\([^)]*;[^)]*;[^)]*\\)\\s*\\{\\s*\\}"
    fixable: false
    mitigation: "等待用 setTimeout / async sleep，轮询加间隔与超时"